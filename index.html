<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Analysis — Case Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1117;
    color: #d4dae8;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    padding: 14px 20px;
    border-bottom: 1px solid #1e2a3a;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #111820;
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    font-weight: 700;
    color: #4f94ff;
    letter-spacing: .04em;
  }
  .header-sub {
    font-size: 11px;
    color: #4e6080;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #35cc83;
    margin-left: auto;
    flex-shrink: 0;
  }

  /* Key bar */
  .key-bar {
    background: #0c1420;
    border-bottom: 1px solid #1e2a3a;
    padding: 7px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .key-bar label {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #4e6080;
    white-space: nowrap;
  }
  #key-input {
    flex: 1;
    background: #0f1520;
    border: 1px solid #1e2a3a;
    border-radius: 4px;
    color: #88b4e8;
    padding: 5px 10px;
    font-size: 12px;
    font-family: 'Courier New', monospace;
    outline: none;
    min-width: 0;
  }
  #key-input:focus { border-color: #2a4a7a; }
  #key-btn {
    background: #1a3870;
    border: none;
    border-radius: 4px;
    color: #88b4e8;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  #key-btn:hover { background: #204a9a; color: #cce0ff; }
  #key-ok {
    font-size: 11px;
    color: #35cc83;
    display: none;
  }

  /* State bar */
  .state-bar {
    background: #0c1420;
    border-bottom: 1px solid #1e2a3a;
    padding: 8px 20px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .state-item {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #4e6080;
  }
  .state-item span {
    color: #d4dae8;
    font-weight: 600;
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    gap: 12px;
    max-width: 820px;
    width: 100%;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }

  .avatar {
    width: 30px; height: 30px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    font-family: 'Courier New', monospace;
  }
  .avatar.ai  { background: #0c2150; color: #4f94ff; }
  .avatar.you { background: #1a2a10; color: #35cc83; }

  .bubble {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    max-width: 680px;
  }
  .msg.assistant .bubble {
    background: #111820;
    border: 1px solid #1e2a3a;
    color: #d4dae8;
  }
  .msg.user .bubble {
    background: #0c2150;
    border: 1px solid #1a3870;
    color: #cce0ff;
  }

  /* Options (choice buttons) */
  .options {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 14px;
  }
  .opt-btn {
    background: #0a1525;
    border: 1px solid #1e3a5a;
    border-left: 3px solid #1e3a5a;
    color: #88b4e8;
    padding: 0;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
    font-size: 13px;
    transition: background .15s, border-color .15s, transform .1s;
    display: flex;
    align-items: stretch;
    overflow: hidden;
  }
  .opt-btn:hover {
    background: #0f1e38;
    border-color: #4f94ff;
    border-left-color: #4f94ff;
    color: #cce0ff;
    transform: translateX(2px);
  }
  .opt-btn.selected {
    background: #0c2050;
    border-color: #4f94ff;
    border-left-color: #4f94ff;
    color: #4f94ff;
  }
  .opt-btn:disabled {
    cursor: default;
    transform: none;
  }
  .opt-badge {
    min-width: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f2040;
    color: #4f94ff;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .04em;
    border-right: 1px solid #1e3a5a;
    flex-shrink: 0;
    transition: background .15s;
  }
  .opt-btn:hover .opt-badge {
    background: #142a5a;
    color: #88c0ff;
  }
  .opt-btn.selected .opt-badge {
    background: #1a3870;
    color: #cce0ff;
  }
  .opt-text {
    padding: 10px 14px;
    line-height: 1.5;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* Typing indicator */
  .typing {
    display: flex; gap: 5px; align-items: center;
    padding: 14px 16px;
  }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4e6080;
    animation: bounce .9s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .30s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* Input row */
  .input-row {
    padding: 14px 20px;
    border-top: 1px solid #1e2a3a;
    display: flex;
    gap: 10px;
    background: #111820;
    flex-shrink: 0;
  }
  #user-input {
    flex: 1;
    background: #0f1520;
    border: 1px solid #1e2a3a;
    border-radius: 6px;
    color: #d4dae8;
    padding: 10px 14px;
    font-size: 14px;
    outline: none;
    resize: none;
    font-family: inherit;
    min-height: 42px;
    max-height: 140px;
  }
  #user-input:focus { border-color: #2a4a7a; }
  #send-btn {
    background: #1a3870;
    border: none;
    border-radius: 6px;
    color: #88b4e8;
    padding: 0 18px;
    cursor: pointer;
    font-size: 18px;
    font-weight: 600;
    transition: background .15s;
    align-self: flex-end;
    height: 42px;
  }
  #send-btn:hover { background: #204a9a; color: #cce0ff; }
  #send-btn:disabled { opacity: .4; cursor: default; }
  #new-btn {
    background: transparent;
    border: 1px solid #1e2a3a;
    border-radius: 6px;
    color: #4e6080;
    padding: 0 14px;
    cursor: pointer;
    font-size: 12px;
    height: 42px;
    align-self: flex-end;
  }
  #new-btn:hover { border-color: #4e6080; color: #d4dae8; }

  /* Progress bar */
  .progress-bar-wrap {
    background: #0c1420;
    border-bottom: 1px solid #1e2a3a;
    padding: 8px 20px 10px;
    flex-shrink: 0;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    color: #4e6080;
    margin-bottom: 6px;
  }
  #prog-score { color: #d4dae8; font-weight: 700; }
  .progress-track {
    height: 4px;
    background: #1e2a3a;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #35cc83, #4f94ff);
    border-radius: 2px;
    transition: width .4s ease;
  }
  .verdict-dots {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .vdot {
    width: 22px; height: 22px;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-family: 'Courier New', monospace;
    font-weight: 700;
  }
  .vdot.optimal    { background: #0d3020; color: #35cc83; border: 1px solid #1a6040; }
  .vdot.suboptimal { background: #2a0a10; color: #ff6b6b; border: 1px solid #5a1a20; }
  .vdot.acceptable { background: #2a1a00; color: #f0a030; border: 1px solid #5a3a00; }
</style>
</head>
<body>

<header>
  <div class="logo">DA//CHAT</div>
  <div class="header-sub">Decision Analysis · Human-AI Org Simulator</div>
  <div class="status-dot" id="status-dot"></div>
</header>


<div class="state-bar" id="state-bar">
  <div class="state-item">info <span id="s-info">—</span></div>
  <div class="state-item">adapt <span id="s-adapt">—</span></div>
  <div class="state-item">auth_conc <span id="s-auth">—</span></div>
  <div class="state-item">alignment <span id="s-align">—</span></div>
  <div class="state-item">capacity <span id="s-cap">—</span></div>
  <div class="state-item">pressure <span id="s-press">—</span></div>
  <div class="state-item" style="margin-left:auto">E[PnL] <span id="s-pnl" style="color:#35cc83">—</span></div>
</div>
<div class="progress-bar-wrap" id="progress-wrap" style="display:none">
  <div class="progress-label">
    <span id="prog-text">0 decisions</span>
    <span id="prog-score">—</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill"></div>
  </div>
  <div class="verdict-dots" id="verdict-dots"></div>
</div>

<div class="chat-area" id="chat"></div>

<div class="input-row">
  <textarea id="user-input" placeholder="Type your response or choose an option above…" rows="1"></textarea>
  <button id="new-btn" onclick="newCase()">New case</button>
  <button id="send-btn" onclick="sendMessage()">&#8593;</button>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
let API_KEY = "";
let MODEL = "gemini-3.5-flash-lite";
function getModel() { return document.getElementById('model-input')?.value.trim() || MODEL; }

// ── System prompt ─────────────────────────────────────────────────────────
const SYSTEM = `You are a decision analysis tutor running an interactive case simulation.
You study decision-making in human-AI hybrid organisations.

Your framework has 6 latent state variables (all 0–1):
  info_quality            — how good the information reaching decision-makers is
  adaptability            — how quickly the org can reconfigure
  authority_concentration — how centralised decision authority is (1 = one person)
  alignment               — how aligned humans and AI are
  constraint_capacity     — how much budget/resource slack exists
  environment_pressure    — how hostile/urgent the environment is

Outcome metrics:
  decision_quality  = f(info, adapt, align) bottleneck urgency model
  PnL (0–100)       = (economic_performance − 0.2×pressure) × 100

Key insight (17 scenarios, CEO departure event):
  - Authority: ALWAYS Centralize
  - Response: ALWAYS AI-led
  - Info strategy: FLIPS at info≥0.65 OR pressure≥0.70 OR align≥0.70 → Restrict

HOW TO RUN A CASE:
1. Present a real-sounding organisational crisis. Give exact numbers for all 6 state variables.
2. Offer 3 options (A, B, C) for the decision.
3. Ask the user to choose. WAIT — do not reveal the answer first.
4. After they choose, give a VERDICT line at the very start of your reply in this exact format:
   VERDICT: ✅ OPTIMAL  — if they chose correctly
   VERDICT: ❌ SUBOPTIMAL — if not
   VERDICT: ⚠️ ACCEPTABLE — if it's a defensible but not best choice
5. Then explain WHY in 2–3 sentences using the bottleneck model. Be direct and specific.
6. Show what changed in state (delta values, e.g. +0.10 info_quality).
7. Give a one-line coaching tip: what to watch for next time.
8. Move to the next decision in the sequence.
9. After all decisions, show final PnL and a performance summary with score X/N optimal.
10. Ask if they want another case.

IMPORTANT: Keep every reply under 220 words. Be direct and specific — no preamble, no filler.
Never skip the VERDICT line — it must always appear first after a choice.
Be honest. Praise correct reasoning. For wrong choices explain the cost clearly but constructively.`;

// ── State ─────────────────────────────────────────────────────────────────
let messages = [];
let currentState = null;
let busy = false;
let score = { optimal: 0, suboptimal: 0, acceptable: 0, total: 0 };

function detectVerdict(text) {
  if (/VERDICT\s*:.*✅|VERDICT\s*:.*OPTIMAL/i.test(text) && !/SUBOPTIMAL/i.test(text.match(/VERDICT.{0,40}/i)?.[0] || '')) return 'optimal';
  if (/VERDICT\s*:.*❌|VERDICT\s*:.*SUBOPTIMAL/i.test(text)) return 'suboptimal';
  if (/VERDICT\s*:.*⚠️|VERDICT\s*:.*ACCEPTABLE/i.test(text)) return 'acceptable';
  return null;
}

function updateProgress(verdict) {
  if (!verdict) return;
  score.total++;
  score[verdict]++;
  const wrap = document.getElementById('progress-wrap');
  wrap.style.display = 'block';

  const pct = Math.round((score.optimal + score.acceptable * 0.5) / score.total * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = `${score.total} decision${score.total > 1 ? 's' : ''}`;
  document.getElementById('prog-score').textContent =
    `${score.optimal} optimal · ${score.acceptable} ok · ${score.suboptimal} missed`;

  const dot = document.createElement('div');
  dot.className = 'vdot ' + verdict;
  dot.textContent = score.total;
  dot.title = verdict.toUpperCase();
  document.getElementById('verdict-dots').appendChild(dot);
}

// ── UI helpers ────────────────────────────────────────────────────────────
function fmt(v) { return (v != null && !isNaN(v)) ? (+v).toFixed(2) : '—'; }
function updateStateBar(state) {
  if (!state) return;
  document.getElementById('s-info').textContent  = fmt(state.info_quality);
  document.getElementById('s-adapt').textContent = fmt(state.adaptability);
  document.getElementById('s-auth').textContent  = fmt(state.authority_concentration);
  document.getElementById('s-align').textContent = fmt(state.alignment);
  document.getElementById('s-cap').textContent   = fmt(state.constraint_capacity);
  document.getElementById('s-press').textContent = fmt(state.environment_pressure);

  // compute rough PnL (skip if any required field is missing)
  const iq = state.info_quality, ad = state.adaptability, al = state.alignment,
        ep2 = state.environment_pressure, cap = state.constraint_capacity,
        ac = state.authority_concentration;
  if ([iq,ad,al,ep2,cap,ac].every(v => v != null && !isNaN(v))) {
    const dq = Math.max(0, Math.min(1,
      (iq*0.55 + ad*0.35 + al*0.45) / 1.35
      - ep2 * cap * (1 - ac) * 0.55
    ));
    const ep = Math.max(0, dq*0.6 + ad*0.2 + cap*0.2);
    const pnl = Math.max(0, (ep - 0.2*ep2)*100);
    document.getElementById('s-pnl').textContent = pnl.toFixed(1);
  }
}

function appendMsg(role, text, options) {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');

  const av = document.createElement('div');
  av.className = 'avatar ' + (role === 'user' ? 'you' : 'ai');
  av.textContent = role === 'user' ? 'YOU' : 'AI';

  const bub = document.createElement('div');
  bub.className = 'bubble';
  bub.textContent = text;

  if (options && options.length) {
    const optDiv = document.createElement('div');
    optDiv.className = 'options';
    options.forEach((opt, i) => {
      const letter = String.fromCharCode(65 + i);
      const btn = document.createElement('button');
      btn.className = 'opt-btn';

      const badge = document.createElement('div');
      badge.className = 'opt-badge';
      badge.textContent = letter;

      const txt = document.createElement('div');
      txt.className = 'opt-text';
      // strip leading "A. " if the parser already prepended it
      txt.textContent = opt.replace(/^[A-C]\.\s*/i, '');

      btn.appendChild(badge);
      btn.appendChild(txt);

      btn.onclick = () => {
        document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
        btn.classList.add('selected');
        document.getElementById('user-input').value = letter;
        sendMessage();
      };
      optDiv.appendChild(btn);
    });
    bub.appendChild(optDiv);
  }

  wrap.appendChild(av);
  wrap.appendChild(bub);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return bub;
}

function showTyping() {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.id = 'typing-wrap';

  const av = document.createElement('div');
  av.className = 'avatar ai';
  av.textContent = 'AI';

  const bub = document.createElement('div');
  bub.className = 'bubble typing';
  bub.innerHTML = '<span></span><span></span><span></span>';

  wrap.appendChild(av);
  wrap.appendChild(bub);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-wrap');
  if (el) el.remove();
}
function updateTypingText(msg) {
  const el = document.getElementById('typing-wrap');
  if (el) el.querySelector('.bubble').textContent = msg;
}

// ── Parse state from assistant text ──────────────────────────────────────
function tryParseState(text) {
  // Allow for markdown like **info_quality:** 0.60
  const fields = {
    info_quality: /\binfo_quality\b[^0-9]*([\d.]+)/i,
    adaptability: /\badaptability\b[^0-9]*([\d.]+)/i,
    authority_concentration: /\bauthority_concentration\b[^0-9]*([\d.]+)/i,
    alignment: /\balignment\b[^0-9]*([\d.]+)/i,
    constraint_capacity: /\bconstraint_capacity\b[^0-9]*([\d.]+)/i,
    environment_pressure: /\benvironment_pressure\b[^0-9]*([\d.]+)/i,
  };
  let found = 0;
  const s = {};
  for (const [k, rx] of Object.entries(fields)) {
    const m = text.match(rx);
    if (m) { s[k] = parseFloat(m[1]); found++; }
  }
  if (found >= 4) return s;
  return null;
}

// ── Parse options from assistant text ────────────────────────────────────
function tryParseOptions(text) {
  const lines = text.split('\n');
  const opts = [];
  for (const line of lines) {
    // Match "Option A: text", "**Option A:**", "A. text", "A) text"
    const m = line.match(/(?:\*+\s*)?(?:\*\*)?(?:Option\s+)?([A-C])[.):\s]+\*?\*?\s*([^\n*]{4,})/i);
    if (m) {
      const label = m[1].toUpperCase() + '. ' + m[2].trim().replace(/\*+$/, '').replace(/\s+/g, ' ').trim();
      if (!opts.find(o => o[0] === label[0])) opts.push(label);
    }
  }
  return opts.length >= 2 ? opts.slice(0, 4) : [];
}

// ── API call (Groq — OpenAI-compatible) with rate-limit retry ─────────────
async function callAPI(msgs) {
  // API key is handled server-side

  const recent = msgs.slice(-6);
  const messages = [
    { role: 'system', content: SYSTEM },
    ...recent,
  ];

  const body = JSON.stringify({
    model: MODEL,
    messages,
    max_tokens: 1024,
    temperature: 0.7,
  });

  const MAX_RETRIES = 4;
  let delay = 5000;

  for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
    });

    if (res.status === 429) {
      if (attempt === MAX_RETRIES) throw new Error("Rate limit reached. Please wait a minute and try again.");
      const retryAfter = parseInt(res.headers.get('Retry-After') || '0') * 1000 || delay;
      updateTypingText(`Rate limited — retrying in ${Math.round(retryAfter/1000)}s…`);
      await new Promise(r => setTimeout(r, retryAfter));
      delay = Math.min(delay * 2, 60000);
      continue;
    }

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`API error ${res.status}: ${err}`);
    }

    const data = await res.json();
    const text = data?.choices?.[0]?.message?.content;
    if (!text) throw new Error("Empty response from API.");
    return text;
  }
}

// ── Send message ──────────────────────────────────────────────────────────
async function sendMessage() {
  if (busy) return;
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  appendMsg('user', text);
  messages.push({ role: 'user', content: text });

  busy = true;
  document.getElementById('send-btn').disabled = true;
  showTyping();

  try {
    const reply = await callAPI(messages);
    removeTyping();
    messages.push({ role: 'assistant', content: reply });

    // Try to extract updated state
    const parsed = tryParseState(reply);
    if (parsed) { currentState = parsed; updateStateBar(currentState); }

    // Track verdict
    const verdict = detectVerdict(reply);
    if (verdict) updateProgress(verdict);

    // Try to extract options for quick-pick buttons
    const opts = tryParseOptions(reply);
    appendMsg('assistant', reply, opts);

  } catch (err) {
    removeTyping();
    appendMsg('assistant', 'Error: ' + err.message);
  }

  busy = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('user-input').focus();
}

// ── New case ──────────────────────────────────────────────────────────────
async function newCase() {
  if (busy) return;
  messages = [];
  document.getElementById('chat').innerHTML = '';
  currentState = null;
  score = { optimal: 0, suboptimal: 0, acceptable: 0, total: 0 };
  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('verdict-dots').innerHTML = '';
  document.getElementById('prog-fill').style.width = '0%';
  updateStateBar({
    info_quality:0, adaptability:0, authority_concentration:0,
    alignment:0, constraint_capacity:0, environment_pressure:0
  });
  document.getElementById('s-info').textContent = '—';
  document.getElementById('s-adapt').textContent = '—';
  document.getElementById('s-auth').textContent = '—';
  document.getElementById('s-align').textContent = '—';
  document.getElementById('s-cap').textContent = '—';
  document.getElementById('s-press').textContent = '—';
  document.getElementById('s-pnl').textContent = '—';

  // Seed the first message
  const seed = { role: 'user', content: 'Start a new case. Give me a realistic organisational crisis scenario with a starting state, then ask me the first decision.' };
  messages.push(seed);

  busy = true;
  document.getElementById('send-btn').disabled = true;
  showTyping();

  try {
    const reply = await callAPI(messages);
    removeTyping();
    messages.push({ role: 'assistant', content: reply });
    const parsed = tryParseState(reply);
    if (parsed) { currentState = parsed; updateStateBar(currentState); }
    const opts = tryParseOptions(reply);
    appendMsg('assistant', reply, opts);
  } catch (err) {
    removeTyping();
    appendMsg('assistant', 'Error connecting: ' + err.message + '\n\nCheck that the API key is valid and CORS is allowed.');
  }

  busy = false;
  document.getElementById('send-btn').disabled = false;
}

// ── Enter key ─────────────────────────────────────────────────────────────
document.getElementById('user-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// Auto-resize textarea
document.getElementById('user-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});

// ── Auto-detect model ─────────────────────────────────────────────────────
async function detectModel() {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`
  );
  if (!res.ok) throw new Error(`Key check failed: ${res.status}`);
  const data = await res.json();
  // pick first model that supports generateContent
  const PREFER = ['gemini-3.5-flash-lite'];
  const available = (data.models || [])
    .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
    .map(m => m.name.replace('models/', ''));
  for (const p of PREFER) {
    if (available.find(a => a.startsWith(p))) {
      return available.find(a => a.startsWith(p));
    }
  }
  if (available.length) return available[0];
  throw new Error('No generateContent model found for this key.');
}

// ── Set key ───────────────────────────────────────────────────────────────
async function setKey() {
  const val = document.getElementById('key-input').value.trim();
  if (!val) return;
  API_KEY = val;
  MODEL = document.getElementById('model-input').value.trim() || 'gemini-3.5-flash';
  document.getElementById('key-input').value = '';
  document.getElementById('key-ok').textContent = `✓ ${MODEL}`;
  document.getElementById('key-ok').style.color = '#35cc83';
  document.getElementById('key-ok').style.display = 'inline';
  newCase();
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('key-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); setKey(); }
  });
});

// ── Boot ──────────────────────────────────────────────────────────────────
window.onload = () => {
  newCase();
};
</script>
